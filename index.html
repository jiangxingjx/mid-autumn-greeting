<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中秋节祝福</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            background: linear-gradient(to bottom, #0f0c29, #302b63, #24243e);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* 星星背景 */
        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* 月亮 */
        .moon {
            position: absolute;
            top: 60px;
            right: 100px;
            width: 120px;
            height: 120px;
            background: radial-gradient(circle at 30% 30%, #fff9e6, #ffd700, #ffb347);
            border-radius: 50%;
            box-shadow: 
                0 0 60px rgba(255, 215, 0, 0.6),
                0 0 100px rgba(255, 179, 71, 0.4),
                inset -10px -10px 30px rgba(255, 140, 0, 0.3);
            animation: moonGlow 4s infinite ease-in-out;
        }

        @keyframes moonGlow {
            0%, 100% { box-shadow: 0 0 60px rgba(255, 215, 0, 0.6), 0 0 100px rgba(255, 179, 71, 0.4); }
            50% { box-shadow: 0 0 80px rgba(255, 215, 0, 0.8), 0 0 120px rgba(255, 179, 71, 0.6); }
        }

        /* 主容器 */
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 50px 60px;
            text-align: center;
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 10;
            max-width: 500px;
            width: 90%;
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: #ffd700;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(255, 215, 0, 0.5);
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.7);
            font-size: 1rem;
            margin-bottom: 40px;
        }

        .input-group {
            margin-bottom: 30px;
        }

        input[type="text"] {
            width: 100%;
            padding: 16px 24px;
            font-size: 1.1rem;
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            outline: none;
            transition: all 0.3s ease;
            text-align: center;
        }

        input[type="text"]::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        input[type="text"]:focus {
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
            background: rgba(255, 255, 255, 0.15);
        }

        button {
            width: 100%;
            padding: 16px 32px;
            font-size: 1.1rem;
            font-weight: 600;
            color: #302b63;
            background: linear-gradient(135deg, #ffd700, #ffb347);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.5);
        }

        button:active {
            transform: translateY(0);
        }

        /* 祝福语显示区域 */
        .greeting-result {
            margin-top: 30px;
            padding: 30px;
            background: rgba(255, 215, 0, 0.1);
            border-radius: 16px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            display: none;
            animation: slideIn 0.5s ease-out;
        }

        .greeting-result.show {
            display: block;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .greeting-text {
            font-size: 1.5rem;
            color: #ffd700;
            line-height: 1.8;
            text-shadow: 0 2px 10px rgba(255, 215, 0, 0.3);
        }

        .greeting-text .name {
            font-size: 1.8rem;
            font-weight: bold;
            color: #fff;
        }

        /* 玉兔装饰 */
        .rabbit {
            position: absolute;
            bottom: 30px;
            left: 50px;
            font-size: 60px;
            animation: bounce 2s infinite ease-in-out;
            opacity: 0.8;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* 灯笼 */
        .lantern {
            position: absolute;
            font-size: 50px;
            animation: sway 3s infinite ease-in-out;
        }

        .lantern-1 {
            top: 40px;
            left: 80px;
            animation-delay: 0s;
        }

        .lantern-2 {
            top: 100px;
            left: 150px;
            animation-delay: 1s;
        }

        @keyframes sway {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg); }
        }

        /* 响应式 */
        @media (max-width: 600px) {
            .container {
                padding: 40px 30px;
            }

            h1 {
                font-size: 1.8rem;
            }

            .moon {
                width: 80px;
                height: 80px;
                top: 30px;
                right: 30px;
            }

            .rabbit {
                font-size: 40px;
                left: 20px;
                bottom: 20px;
            }

            .lantern {
                font-size: 35px;
            }
        }
    </style>
</head>
<body>
    <!-- 星星背景 -->
    <div class="stars" id="stars"></div>

    <!-- 月亮 -->
    <div class="moon"></div>

    <!-- 灯笼 -->
    <div class="lantern lantern-1">🏮</div>
    <div class="lantern lantern-2">🏮</div>

    <!-- 玉兔 -->
    <div class="rabbit">🐰</div>

    <!-- 主容器 -->
    <div class="container">
        <h1>🌕 中秋节快乐 🌕</h1>
        <p class="subtitle">输入你的名字，接收专属中秋祝福</p>

        <div class="input-group">
            <input 
                type="text" 
                id="nameInput" 
                placeholder="请输入你的名字"
                maxlength="20"
            >
        </div>

        <button onclick="generateGreeting()">送出祝福 🎁</button>

        <div class="greeting-result" id="greetingResult">
            <p class="greeting-text">
                <span class="name" id="userName"></span>，<br>
                中秋节快乐！🌕<br>
                <span style="font-size: 1rem; color: rgba(255,255,255,0.7);">愿月圆人团圆，幸福常相伴 🥮</span>
            </p>
        </div>
    </div>

    <script>
        // 生成星星
        function createStars() {
            const starsContainer = document.getElementById('stars');
            const starCount = 100;

            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.width = Math.random() * 3 + 1 + 'px';
                star.style.height = star.style.width;
                star.style.animationDelay = Math.random() * 3 + 's';
                star.style.animationDuration = (Math.random() * 2 + 2) + 's';
                starsContainer.appendChild(star);
            }
        }

        // 生成祝福语
        function generateGreeting() {
            const nameInput = document.getElementById('nameInput');
            const greetingResult = document.getElementById('greetingResult');
            const userName = document.getElementById('userName');

            const name = nameInput.value.trim();

            if (!name) {
                nameInput.focus();
                nameInput.style.borderColor = '#ff6b6b';
                setTimeout(() => {
                    nameInput.style.borderColor = 'rgba(255, 215, 0, 0.3)';
                }, 1000);
                return;
            }

            userName.textContent = name;
            greetingResult.classList.add('show');

            // 添加点击音效（可选）
            playCelebration();
        }

        // 简单的庆祝动画
        function playCelebration() {
            const container = document.querySelector('.container');
            container.style.animation = 'none';
            setTimeout(() => {
                container.style.animation = 'fadeInUp 0.5s ease-out';
            }, 10);
        }

        // 回车键触发
        document.getElementById('nameInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                generateGreeting();
            }
        });

        // 初始化
        createStars();
    </script>
</body>
</html>
